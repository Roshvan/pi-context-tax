name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to finish publishing
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Verify version tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(node --print "require('./package.json').version")
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish missing package version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/published-package.json" --write-out '%{http_code}' "https://registry.npmjs.org/pi-context-tax/$RELEASE_VERSION")
          case "$status" in
            200)
              published_head=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync(process.argv[1], "utf8")).gitHead ?? "")' "$RUNNER_TEMP/published-package.json")
              test "$published_head" = "$(git rev-parse HEAD)" || { echo 'Published version belongs to another commit.' >&2; exit 1; }
              echo "Package version $RELEASE_VERSION already published from this commit."
              ;;
            404) npm publish ;;
            *) echo "npm registry returned HTTP $status; refusing to publish." >&2; exit 1 ;;
          esac
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --verify-tag
          fi
